## HBA, HBD

- **HBA** - Hydrogen bonds acceptors;
- **HBD** - hydrogen bonds donor

![HBA/HBD](elementy/300px-WikipediaHDonorAcceptor.png)

- mogą zmieniać się wraz z pH!

[wikipedia](https://en.wikipedia.org/wiki/Hydrogen_bond) <!-- .element: style="font-size: 14px; color: silver;" -->

---

## HBA, HBD

- *Donor count* = the sum of the atoms in the molecule which have H donor property.
- *Donor sites* = the sum of the H atoms connected to the donor atoms.

![pary e](elementy/anilina.png)

count = 1, sites = 2
---

## HBA, HBD

- *Acceptor count* = the sum of the acceptor atoms. An acceptor atom always has a lone electron pair/lone electron pairs that is capable of establishing a H bond.
- *Acceptor sites* = the sum of the lone pairs on the acceptor atoms.

![pary e](elementy/parye.png)

---

## logP

- **clogP, xlogP** - calculated logP
- współczynnik podziału (The partition coefficient)
- is a ratio of concentrations of **un-ionized compound** between the two liquid phases

![logP](https://upload.wikimedia.org/math/4/7/2/472cd3567a5fcfdf2950f830fd41423c.png)

---

## logD

![logD](https://upload.wikimedia.org/math/c/d/0/cd04417ce4084b638628a88497e679d8.png)

- The **distribution coefficient** is the ratio of the sum of the concentrations of all forms of the compound (ionized plus un-ionized) in each of the two phases. As such, **it depends on pH**.

## pK<sub>a</sub>

- acid dissociation co-efficient
- pK<sub>a</sub> = –log[K<sub>a</sub>]
- K<sub>a</sub> - stała dysocjacji kwasu
- pH przy którym <i>połowa cząsteczek jest zjonizowana a druga połowa nie</i> (wybaczcie uproszczenie!)

## pK<sub>a</sub>

- (generalnie) cząstki neutralne dużo chętniej przechodzą przez membrany
- cząstki zjonizowane chętniej pozostają w osoczu i są wydalane nerkowo (renal excretion)

## PSA (TPSA)

**(Topological) Polar surface area** (Å²)

Paracetamol:

![paracetamol](elementy/paracetamol.png)

![PSA](elementy/Polar-surface-area.png) <!-- .element: class="fragment" -->

---
## PSA

- Molecules with a PSA > 140 tend to be poor at permeating cell membranes
- For molecules to penetrate the blood–brain barrier (and thus act on receptors in the central nervous system), a PSA < 90 <!-- .element: class="fragment" -->
- TPSA koreluje z efektami niepożądanymi  in vivo <!-- .element: class="fragment" -->
- cząsteczki z wysokim logP i niskim PSA mają 2.5x wyższe prawdopodobieństwo bycia toksycznymi niż nietoksycznymi <!-- .element: class="fragment" -->
 - i odwrotnie: logP<3 i TPSA >75 - niższe ryzyko toksyczności <!-- .element: class="fragment" -->

źródło: Książka Small Molecule Medicinal Chemistry: Strategies and Technologies pod redakcją Werngard Czechtizky,Peter Hamley  <!-- .element: style="font-size: 14px; color: silver;" -->

## Reguły Lipińskiego

- Lipinski's rule of five (Ro5)

- zestaw wytycznych który pozwala przewidzieć, czy dany związek chemiczny ma szansę stać się lekiem podawanym doustnie (na podstawie jego biodostępności i właściwości farmakokinetycznych)
- reguły statystyczne
- nie przewiduje aktywności związku


<pre>
logP < 5
MW < 500
HBD < 5
HBA < 10
</pre><!-- .element: class="fragment" data-fragment-index="1" -->
